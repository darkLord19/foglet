name: sandbox-images

on:
  push:
    branches:
      - master
    paths:
      - docker/claude/Dockerfile
      - .github/workflows/sandbox-images.yml
  workflow_dispatch:
    inputs:
      claude_version:
        description: 'Claude CLI npm version (e.g. 1.0.3). Leave blank to use latest.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-claude:
    name: Build fog-claude image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Claude CLI version
        id: claude-ver
        run: |
          if [ -n "${{ github.event.inputs.claude_version }}" ]; then
            VER="${{ github.event.inputs.claude_version }}"
          else
            VER=$(npm view @anthropic-ai/claude-code version 2>/dev/null)
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Claude CLI version: ${VER}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push fog-claude
        uses: docker/build-push-action@v6
        with:
          context: docker/claude
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_VERSION=${{ steps.claude-ver.outputs.version }}
          tags: |
            ghcr.io/darklord19/fog-claude:latest
            ghcr.io/darklord19/fog-claude:${{ steps.claude-ver.outputs.version }}
          labels: |
            fog.claude.version=${{ steps.claude-ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
